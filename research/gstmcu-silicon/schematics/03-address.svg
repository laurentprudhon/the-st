<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860"
     font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="03 · The address path — four owners, ten muxes">
<defs>
  <marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f5b"/></marker>
  <marker id="a-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4761a"/></marker>
  <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fb0"/></marker>
  <marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5aad"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">03 · The address path — four owners, ten muxes</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Every MAD line is a 4:1 choice between the CPU/DMA bus, the video address, the sound address and the refresh row.</text>
<rect x="44" y="130" width="250" height="84" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="169.0" y="168.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">A0–A23 · the bus</text>
<text x="169.0" y="187.0" text-anchor="middle" font-size="11" fill="#63666f">CPU, or the DMA master holding it</text><rect x="44" y="232" width="250" height="84" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="169.0" y="270.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">VA — video address</text>
<text x="169.0" y="289.0" text-anchor="middle" font-size="11" fill="#63666f">after the WLOC line-offset muxes</text><rect x="44" y="334" width="250" height="84" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="169.0" y="372.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">MA — sound address</text>
<text x="169.0" y="391.0" text-anchor="middle" font-size="11" fill="#63666f">sheet 17 · 21-bit counter</text><rect x="44" y="436" width="250" height="84" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="169.0" y="474.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">RA0–RA9 — refresh row</text>
<text x="169.0" y="493.0" text-anchor="middle" font-size="11" fill="#63666f">sheet 11 · ten stages on REFCLKB</text><rect x="360" y="130" width="250" height="390" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="485.0" y="321.0" text-anchor="middle" font-size="15" font-weight="700" fill="#22232a">ten MX41 muxes</text>
<text x="485.0" y="340.0" text-anchor="middle" font-size="11" fill="#63666f">one per MAD line</text><text x="485" y="300" font-size="12" fill="#22232a" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">A  ▸  MADn</text><text x="485" y="324" font-size="12" fill="#22232a" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">VA ▸</text><text x="485" y="348" font-size="12" fill="#22232a" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">MA ▸</text><text x="485" y="372" font-size="12" fill="#22232a" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">RA ▸</text><text x="485" y="410" font-size="10.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">selects: REF · SADSEL</text><text x="485" y="426" font-size="10.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">IXDMAB · ADDRSELB</text><rect x="660" y="130" width="250" height="84" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="785.0" y="168.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">MAD0–MAD9 to the SIMMs</text>
<text x="785.0" y="187.0" text-anchor="middle" font-size="11" fill="#63666f">row address on RAS, column on CAS</text><rect x="660" y="232" width="250" height="84" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="785.0" y="270.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">RAS0 / RAS1</text>
<text x="785.0" y="289.0" text-anchor="middle" font-size="11" fill="#63666f">one per bank, one per slot</text><rect x="660" y="334" width="250" height="84" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="785.0" y="372.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">CAS0 / CAS1</text>
<text x="785.0" y="391.0" text-anchor="middle" font-size="11" fill="#63666f">= NAND(TIME2, LCYCSELB, RAMxA, VOS)</text><rect x="660" y="436" width="250" height="84" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="785.0" y="474.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">WE · ROWB · LATCH</text>
<text x="785.0" y="493.0" text-anchor="middle" font-size="11" fill="#63666f">write · row/column · data latch</text><line x1="294" y1="172" x2="360" y2="172" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-a)"/><line x1="294" y1="274" x2="360" y2="274" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-a)"/><line x1="294" y1="376" x2="360" y2="376" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-a)"/><line x1="294" y1="478" x2="360" y2="478" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-a)"/><line x1="610" y1="172" x2="660" y2="172" stroke="#1f5fa8" stroke-width="4" marker-end="url(#a-a)"/><line x1="610" y1="250" x2="660" y2="274" stroke="#b4761a" stroke-width="1.6" marker-end="url(#a-c)" stroke-dasharray="4 4"/><line x1="610" y1="300" x2="660" y2="376" stroke="#b4761a" stroke-width="1.6" marker-end="url(#a-c)" stroke-dasharray="4 4"/><rect x="946" y="130" width="450" height="200" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="1171.0" y="226.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">the designer's table, sheet 23</text>
<text x="1171.0" y="245.0" text-anchor="middle" font-size="11" fill="#63666f">read: ADDRSELB=1 is the internal slot</text><text x="1000" y="176" font-size="10.5" fill="#63666f" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">IXDMAB</text><text x="1074" y="176" font-size="10.5" fill="#63666f" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SADSEL</text><text x="1148" y="176" font-size="10.5" fill="#63666f" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">REF</text><text x="1222" y="176" font-size="10.5" fill="#63666f" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ADDRSELB</text><text x="1296" y="176" font-size="10.5" fill="#63666f" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">owner</text><text x="1000" y="200" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1074" y="200" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1148" y="200" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1222" y="200" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1296" y="200" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">REFRESH</text><text x="1000" y="224" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1074" y="224" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1148" y="224" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1222" y="224" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1296" y="224" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SOUND</text><text x="1000" y="248" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1074" y="248" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1148" y="248" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1222" y="248" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1296" y="248" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">VIDEO</text><text x="1000" y="272" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><text x="1074" y="272" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1148" y="272" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1222" y="272" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1296" y="272" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CPU</text><text x="1000" y="296" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1074" y="296" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1148" y="296" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X</text><text x="1222" y="296" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><text x="1296" y="296" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">DMA</text><rect x="946" y="356" width="450" height="164" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="1171.0" y="434.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">where each input comes from</text>
<text x="1171.0" y="453.0" text-anchor="middle" font-size="11" fill="#63666f">the cross-reference tails on sheet 25</text><text x="966" y="400" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">RA9  ← sheet 11   the refresh chain's taps</text><text x="966" y="422" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">VA9  ← sheet 11   after the WLOC offset muxes</text><text x="966" y="444" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">MA9  ← sheet 17   the sound address counter</text><text x="966" y="466" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">A9   ← sheet 19   the CPU/DMA bus</text><text x="966" y="496" font-size="10.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">four inputs because two lanes share one: on an external slot the granted</text><text x="966" y="510" font-size="10.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">master is already driving the bus.</text><text x="44" y="580" font-size="12" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">The table is a decode, not a priority: REFB and SNDEN are produced by one gate group, so the first two arms</text><text x="44" y="600" font-size="12" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">cannot both be live — the internal slot is video's, else sound's, else the RAS-only refresh.</text><text x="44" y="636" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Ten taps = 1 024 states, and 512 rows per bank is half of that.  Tap 1 is RA9 and tap 10 is RA0,</text><text x="44" y="656" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">so the walk starts at the last stage — the order a refresh row sequence follows.</text><rect x="0" y="814" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="832" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: sheet 25 read at the MUX inputs, sheet 23's printed table, sheet 11's chain; the CAS form from sheets 21–22.</text>
<text x="44" y="847" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">No archive drawing is reproduced: the table and the arrows are redrawn from the netlist's connectivity.</text>
</svg>
