<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880"
     font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="04 · Clocks and counters — what counts, and on which edge">
<defs>
  <marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f5b"/></marker>
  <marker id="a-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4761a"/></marker>
  <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fb0"/></marker>
  <marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5aad"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">04 · Clocks and counters — what counts, and on which edge</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">One oscillator, one ÷2 ladder, one phase generator; then seven counting structures, each with its own clock.</text>
<rect x="44" y="120" width="210" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="149.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">16 MHz</text>
<text x="149.0" y="166.0" text-anchor="middle" font-size="11" fill="#63666f">the master oscillator</text><rect x="300" y="120" width="210" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="405.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">MHZ8</text>
<text x="405.0" y="166.0" text-anchor="middle" font-size="11" fill="#63666f">÷2 · the CPU clock</text><rect x="556" y="120" width="210" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="661.0" y="147.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">MHZ4 = M2CLOCK</text>
<text x="661.0" y="166.0" text-anchor="middle" font-size="11" fill="#63666f">÷2 · the peripheral clock</text><rect x="812" y="120" width="210" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="917.0" y="147.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">MHZ2</text>
<text x="917.0" y="166.0" text-anchor="middle" font-size="11" fill="#63666f">÷2</text><rect x="1068" y="120" width="328" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="1232.0" y="147.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">K500CLK · KHZ500</text>
<text x="1232.0" y="166.0" text-anchor="middle" font-size="11" fill="#63666f">÷2 ÷2 · 500 kHz, and the clocks out</text><line x1="254" y1="151" x2="300" y2="151" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><line x1="510" y1="151" x2="556" y2="151" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><line x1="766" y1="151" x2="812" y2="151" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><line x1="1022" y1="151" x2="1068" y2="151" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><rect x="300" y="224" width="300" height="96" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="450.0" y="268.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">TGEN · the phase ring</text>
<text x="450.0" y="287.0" text-anchor="middle" font-size="11" fill="#63666f">hand-designed macro cell, not library gates</text><line x1="405" y1="182" x2="405" y2="224" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><rect x="660" y="224" width="340" height="96" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="830.0" y="268.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">TIME0 … TIME7</text>
<text x="830.0" y="287.0" text-anchor="middle" font-size="11" fill="#63666f">eight outputs, one phase apart, a slot wide</text><line x1="600" y1="272" x2="660" y2="272" stroke="#8a4fb0" stroke-width="2" marker-end="url(#a-k)"/><text x="660" y="336" font-size="11.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">One phase = 31.25 ns = one half of a 16 MHz clock; sixteen to a 500 ns window.</text><rect x="44" y="368" width="700" height="46" rx="7" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.4"/><text x="60" y="388" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">refresh row</text><text x="60" y="405" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">REFCLKB · one row per 2 µs</text><text x="520" y="395" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ten stages · RA9 … RA0 into the muxes</text><rect x="44" y="424" width="700" height="46" rx="7" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.4"/><text x="60" y="444" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">video address</text><text x="60" y="461" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">VIDCLK · one per 500 ns cycle while DE is high</text><text x="520" y="451" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">24 bits · VCOUNT plus VIDBH/M/L</text><rect x="44" y="480" width="700" height="46" rx="7" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.4"/><text x="60" y="500" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">sound address</text><text x="60" y="517" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SNDCLK · the granted internal slot</text><text x="520" y="507" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">21 bits · SFTH/M/L, compared against frame top</text><rect x="44" y="536" width="700" height="46" rx="7" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.4"/><text x="60" y="556" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">disk DMA address</text><text x="60" y="573" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">RDY / DMADIR from the DMA controller</text><text x="520" y="563" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">24 bits · DMAH/M/L</text><rect x="44" y="592" width="700" height="46" rx="7" fill="#fdf1de" stroke="#b4761a" stroke-width="1.4"/><text x="60" y="612" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">paddle</text><text x="60" y="629" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">PADC · 500 kHz through an eight-tap divider</text><text x="520" y="619" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">four 8-bit results, 0–255, read via the port</text><rect x="44" y="648" width="700" height="46" rx="7" fill="#fdf1de" stroke="#b4761a" stroke-width="1.4"/><text x="60" y="668" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">pen — horizontal</text><text x="60" y="685" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">M2CLOCK, gated by PX033/031/032; cleared by IHSYNC</text><text x="520" y="675" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">captured into MF2 cells on the pen's edge</text><rect x="44" y="704" width="700" height="46" rx="7" fill="#fdf1de" stroke="#b4761a" stroke-width="1.4"/><text x="60" y="724" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">pen — vertical</text><text x="60" y="741" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">IHSYNC + VDE logic; cleared by IVSYNC</text><text x="520" y="731" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">captured into MF2 cells on the pen's edge</text><rect x="800" y="368" width="596" height="124" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="820" y="390" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">REFCLK — how the refresh clock is made</text><text x="820" y="406" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">sheet 27, with K500CLK buffered locally</text><text x="820" y="426" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">NAND(HCTR, LC) → XY2, mixed with K500CLK → a flop whose output is REFCLK</text><text x="820" y="444" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">HCTR = M2CLOCK ÷ 64 (16 µs); LC is a one-clock marker from the TIME pipeline</text><text x="820" y="462" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">REFCLKB = NAND(SNDEN, REFCLK) on sheet 20 — parked high while sound fetches</text><text x="820" y="480" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Result: one row address per 2 µs; 1 024 states in 2.05 ms; a bank in 1.02 ms</text><rect x="800" y="504" width="596" height="120" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.4"/><text x="820" y="530" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Not modelled (ruling, 2026-11-21)</text><text x="820" y="556" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">interlace — the genlock sync parity behind $FF820A bit 0</text><text x="820" y="576" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">TEST — tied inactive on the board, no behaviour to model</text><text x="820" y="596" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">BINT — purpose unknown to two independent readings</text><text x="44" y="800" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Reading this sheet: every counter above is a chain of gates clocked by the net named beside it; none of them is a datapath that can</text><text x="44" y="818" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">be made to count, which is the structural difference from the 68000 whose counters live under microcode.</text><rect x="0" y="834" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="852" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: sheet 7's ÷2 ladder, sheet 27's REFCLK cluster, sheets 11/15/16/17/31/33's counters.</text>
<text x="44" y="867" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Widths and clocks are read from the netlists; the pen's capture is from sheet 33 read cell by cell.</text>
</svg>
