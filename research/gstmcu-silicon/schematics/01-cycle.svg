<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">01 · One cycle — 500 ns, sixteen phases</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">The slot grid as sheet 48 draws it, with the strobes the netlist names. One phase = 31.25 ns.</text>
<rect x="300" y="104" width="540.0" height="44" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.2"/><rect x="840.0" y="104" width="540.0" height="44" fill="#fdf1de" stroke="#b4761a" stroke-width="1.2"/><text x="570.0" y="126" font-size="12" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">internal slot — video / sound / refresh</text><text x="1110.0" y="126" font-size="12" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">external slot — CPU, or the granted master</text><text x="570.0" y="142" font-size="10.5" fill="#63666f" text-anchor="middle" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ADDRSELB high · REF decides video vs sound vs refresh</text><text x="1110.0" y="142" font-size="10.5" fill="#63666f" text-anchor="middle" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ADDRSEL low · IXDMAB picks CPU or DMA</text><line x1="300.0" y1="168" x2="300.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="333.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><line x1="367.5" y1="168" x2="367.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="401.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text><line x1="435.0" y1="168" x2="435.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="468.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">2</text><line x1="502.5" y1="168" x2="502.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="536.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">3</text><line x1="570.0" y1="168" x2="570.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="603.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">4</text><line x1="637.5" y1="168" x2="637.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="671.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">5</text><line x1="705.0" y1="168" x2="705.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="738.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">6</text><line x1="772.5" y1="168" x2="772.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="806.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">7</text><line x1="840.0" y1="168" x2="840.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="873.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">8</text><line x1="907.5" y1="168" x2="907.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="941.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">9</text><line x1="975.0" y1="168" x2="975.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1008.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">10</text><line x1="1042.5" y1="168" x2="1042.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1076.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">11</text><line x1="1110.0" y1="168" x2="1110.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1143.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">12</text><line x1="1177.5" y1="168" x2="1177.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1211.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">13</text><line x1="1245.0" y1="168" x2="1245.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1278.75" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">14</text><line x1="1312.5" y1="168" x2="1312.5" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="1346.25" y="184" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">15</text><line x1="1380.0" y1="168" x2="1380.0" y2="560" stroke="#e8e5db" stroke-width="1"/><text x="284" y="224" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">RAS0</text><line x1="300" y1="232" x2="1380" y2="232" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,226.0 L 637.5,226.0 L 637.5,212.0 L 840.0,212.0 L 840.0,226.0 L 1177.5,226.0 L 1177.5,212.0 L 1380.0,212.0" fill="none" stroke="#b4761a" stroke-width="2.2"/><text x="284" y="284" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CAS0</text><line x1="300" y1="292" x2="1380" y2="292" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,272.0 L 435.0,272.0 L 435.0,286.0 L 772.5,286.0 L 772.5,272.0 L 975.0,272.0 L 975.0,286.0 L 1312.5,286.0 L 1312.5,272.0 L 1380.0,272.0" fill="none" stroke="#b4761a" stroke-width="2.2"/><text x="284" y="344" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">COL/ROW</text><line x1="300" y1="352" x2="1380" y2="352" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,346.0 L 367.5,346.0 L 367.5,332.0 L 637.5,332.0 L 637.5,346.0 L 907.5,346.0 L 907.5,332.0 L 1177.5,332.0 L 1177.5,346.0 L 1380.0,346.0" fill="none" stroke="#1f5fa8" stroke-width="2.2"/><text x="284" y="404" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">LATCH</text><line x1="300" y1="412" x2="1380" y2="412" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,406.0 L 975.0,406.0 L 975.0,392.0 L 1245.0,392.0 L 1245.0,406.0 L 1380.0,406.0" fill="none" stroke="#6f5aad" stroke-width="2.2"/><text x="284" y="464" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">DCYC</text><line x1="300" y1="472" x2="1380" y2="472" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,452.0 L 435.0,452.0 L 435.0,466.0 L 705.0,466.0 L 705.0,452.0 L 1380.0,452.0" fill="none" stroke="#2f7f5b" stroke-width="2.2"/><text x="284" y="524" font-size="12.5" fill="#22232a" text-anchor="end" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SLOAD</text><line x1="300" y1="532" x2="1380" y2="532" stroke="#e8e5db" stroke-width="1" stroke-dasharray="3 5"/><path d="M 300.0,512.0 L 435.0,512.0 L 435.0,526.0 L 705.0,526.0 L 705.0,512.0 L 1380.0,512.0" fill="none" stroke="#2f7f5b" stroke-width="2.2"/><line x1="637.5" y1="600" x2="772.5" y2="600" stroke="#22232a" stroke-width="1.2" marker-end="url(#a-c)"/><line x1="772.5" y1="600" x2="637.5" y2="600" stroke="#22232a" stroke-width="1.2" marker-end="url(#a-c)"/><text x="705.0" y="594" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">tRCD 62.5 ns</text><line x1="300" y1="630" x2="840.0" y2="630" stroke="#8a4fb0" stroke-width="3"/><text x="570.0" y="648" font-size="11" fill="#8a4fb0" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">slot 250 ns · 8 phases</text><line x1="840.0" y1="630" x2="1380" y2="630" stroke="#b4761a" stroke-width="3"/><text x="1110.0" y="648" font-size="11" fill="#b4761a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">slot 250 ns · 8 phases</text><rect x="44" y="686" width="1340" height="76" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.4"/><text x="64" y="712" font-size="12.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">What each strobe belongs to</text><text x="64" y="732" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CAS is per bank and VOS-qualified — which is why a refresh cycle has no CAS at all.  LATCH fires once, in the external half: the read/write data latch.</text><text x="64" y="750" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">DCYC and SLOAD are transparent-latch sample-and-holds of their decode, not resynchronisers — their edge is the decode's edge, one open window later.</text><text x="44" y="600" font-size="11.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">RAS falls at phase 0 of each slot; CAS two phases later;</text><text x="44" y="616" font-size="11.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">COL/ROW is low while RAS falls, so low = row address.</text><rect x="0" y="774" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="792" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: levels transcribed from sheet 48 (MHZ16 numbers 0–15) and the strobe equations of sheets 21 and 22.</text>
<text x="44" y="807" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">The phase width (31.25 ns) follows from CAS being a pure decode of TIME2 meeting the chart's two-number gap.</text>
</svg>
