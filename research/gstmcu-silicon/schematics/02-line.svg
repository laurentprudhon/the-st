<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640"
     font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="02 · One line — 512 clocks, 128 internal slots">
<defs>
  <marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f5b"/></marker>
  <marker id="a-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4761a"/></marker>
  <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fb0"/></marker>
  <marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5aad"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">02 · One line — 512 clocks, 128 internal slots</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">The line's slot budget in low resolution: 80 internal slots to video, 48 to blanking, and what fits in the 48.</text>
<rect x="120" y="180" width="750.0" height="72" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><rect x="870.0" y="180" width="450.0" height="72" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/><text x="495.0" y="212" font-size="13" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">video — one word per cycle, 80 fetches</text><text x="495.0" y="234" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">a group of four words delivered on every fourth DCYC</text><text x="1095.0" y="212" font-size="13" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blanking — 48 slots</text><text x="1095.0" y="234" font-size="11" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">sound ≤ 3.2 · refresh ≤ 32</text><rect x="870.0" y="252" width="300.0" height="26" fill="url(#hatch)" stroke="#b4761a" stroke-width="1.2"/><text x="1020.0" y="270" font-size="11" fill="#22232a" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">refresh — the address advances every 2 µs</text><line x1="120" y1="164" x2="870.0" y2="164" stroke="#2f7f5b" stroke-width="2.4"/><text x="495.0" y="156" font-size="11" fill="#2f7f5b" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">DE high — the Shifter's window</text><line x1="870.0" y1="164" x2="1320" y2="164" stroke="#8a90a8" stroke-width="2.4"/><text x="1095.0" y="156" font-size="11" fill="#63666f" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">HBLANK</text><line x1="120" y1="320" x2="1320" y2="320" stroke="#22232a" stroke-width="1.2"/><line x1="120.0" y1="314" x2="120.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="120.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text><line x1="270.0" y1="314" x2="270.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="270.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">16</text><line x1="420.0" y1="314" x2="420.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="420.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">32</text><line x1="570.0" y1="314" x2="570.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="570.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">48</text><line x1="720.0" y1="314" x2="720.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="720.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64</text><line x1="870.0" y1="314" x2="870.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="870.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">80</text><line x1="1020.0" y1="314" x2="1020.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="1020.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">96</text><line x1="1170.0" y1="314" x2="1170.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="1170.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">112</text><line x1="1320.0" y1="314" x2="1320.0" y2="326" stroke="#22232a" stroke-width="1.2"/><text x="1320.0" y="342" font-size="10" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">128</text><text x="720.0" y="362" font-size="11" fill="#63666f" text-anchor="middle" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">internal slot index · one slot per 500 ns cycle</text><rect x="120" y="390" width="380" height="96" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="310.0" y="434.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">64 µs a line</text>
<text x="310.0" y="453.0" text-anchor="middle" font-size="11" fill="#63666f">512 CPU clocks = 256 slots, half internal</text><rect x="530" y="390" width="380" height="96" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="720.0" y="434.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">80 of 128 slots are video's</text>
<text x="720.0" y="453.0" text-anchor="middle" font-size="11" fill="#63666f">20 words × 4 planes = 80 · 40 × 2 mid · 40 mono</text><rect x="940" y="390" width="380" height="96" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="1130.0" y="434.0" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">the 48 left are blanking's</text>
<text x="1130.0" y="453.0" text-anchor="middle" font-size="11" fill="#63666f">≈2 refreshes and ≤3.2 sound words used, the rest idle</text><text x="120" y="522" font-size="12.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">A frame is 313 such lines: 313 × 512 clocks × 125 ns = 20.03 ms, which is 49.9 Hz.</text><text x="120" y="544" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">The vertical blanking interval is not a special case: the window closes and its slots become blanket refresh and sound.</text><rect x="0" y="594" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="612" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: arithmetic from the design's counters and the sound memo; slot counts from research/gstmcu-silicon-implementation.md §5.2.</text>
<text x="44" y="627" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Refresh's ≤32 is the 2 µs address clock meeting a 64 µs line, not a scheduled budget.</text>
</svg>
