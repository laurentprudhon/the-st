<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010"
     font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="00 · The chip as blocks">
<defs>
  <marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7f5b"/></marker>
  <marker id="a-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4761a"/></marker>
  <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fb0"/></marker>
  <marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5aad"/></marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">00 · The chip as blocks</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">GSTMCU C300589-001 — what feeds what, from the design's own netlists and sheets. Functional, not to scale.</text>
<rect x="44" y="120" width="250" height="92" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="169.0" y="162.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">CPU / DMA bus interface</text>
<text x="169.0" y="181.0" text-anchor="middle" font-size="11" fill="#63666f">A1–A23 · D0–D15 · AS · R/W · FC</text><rect x="44" y="232" width="250" height="78" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="169.0" y="267.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Bus answer</text>
<text x="169.0" y="286.0" text-anchor="middle" font-size="11" fill="#63666f">DTACK · BERR · VMA/VPA · BR/BGACK</text><rect x="44" y="330" width="250" height="70" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="169.0" y="361.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Address decode</text>
<text x="169.0" y="380.0" text-anchor="middle" font-size="11" fill="#63666f">sheet 3 · FFFXXX / FF8XXX / FF9XXX</text><rect x="44" y="420" width="250" height="86" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="169.0" y="459.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Chip + register selects</text>
<text x="169.0" y="478.0" text-anchor="middle" font-size="11" fill="#63666f">CARTSEL · JOYSEL · SNDCS · MFPCS …</text><rect x="330" y="120" width="300" height="92" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="480.0" y="162.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Phase generator · TGEN</text>
<text x="480.0" y="181.0" text-anchor="middle" font-size="11" fill="#63666f">16 phases a window · TIME0–TIME7</text><rect x="330" y="232" width="300" height="110" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/>
<text x="480.0" y="283.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Register bank</text>
<text x="480.0" y="302.0" text-anchor="middle" font-size="11" fill="#63666f">RLC cells read through SAB sense bits</text><rect x="330" y="362" width="300" height="96" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="480.0" y="406.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Address multiplexer</text>
<text x="480.0" y="425.0" text-anchor="middle" font-size="11" fill="#63666f">ten MX41, one per MAD line</text><rect x="330" y="478" width="300" height="96" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="480.0" y="522.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">DRAM strobe generator</text>
<text x="480.0" y="541.0" text-anchor="middle" font-size="11" fill="#63666f">RAS0/1 · CAS0/1 · WE · ROWB · LATCH</text><rect x="666" y="120" width="340" height="150" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="686" y="148" font-size="14" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Internal slot owner</text><text x="686" y="172" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">one rule, no ranking</text><text x="686" y="196" font-size="12" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">video    if DE is high</text><text x="686" y="216" font-size="12" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">sound    else if SREQ</text><text x="686" y="236" font-size="12" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">refresh  else, RAS only</text><text x="686" y="258" font-size="10.5" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the external slot: CPU or granted master</text><rect x="666" y="300" width="340" height="80" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="836.0" y="336.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">MAD0–MAD9 + RAS/CAS/WE</text>
<text x="836.0" y="355.0" text-anchor="middle" font-size="11" fill="#63666f">multiplexed address to the four SIMMs</text><rect x="666" y="400" width="340" height="88" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="836.0" y="440.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Refresh address chain</text>
<text x="836.0" y="459.0" text-anchor="middle" font-size="11" fill="#63666f">ten stages · one row per 2 µs</text><rect x="666" y="508" width="340" height="88" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="836.0" y="548.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Video fetch buffer</text>
<text x="836.0" y="567.0" text-anchor="middle" font-size="11" fill="#63666f">one word per cycle · group of four</text><rect x="1030" y="120" width="366" height="74" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="1213.0" y="153.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Video address counter</text>
<text x="1213.0" y="172.0" text-anchor="middle" font-size="11" fill="#63666f">24 bits · VIDCLK, one step per cycle</text><rect x="1030" y="204" width="366" height="74" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="1213.0" y="237.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Sound address counter</text>
<text x="1213.0" y="256.0" text-anchor="middle" font-size="11" fill="#63666f">21 bits · SNDCLK on the granted slot</text><rect x="1030" y="288" width="366" height="74" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="1213.0" y="321.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Disk DMA address counter</text>
<text x="1213.0" y="340.0" text-anchor="middle" font-size="11" fill="#63666f">24 bits · RDY / DMADIR handshake</text><rect x="1030" y="372" width="366" height="74" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="1213.0" y="405.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Paddle divider</text>
<text x="1213.0" y="424.0" text-anchor="middle" font-size="11" fill="#63666f">eight taps → PADC at 500 kHz/8</text><rect x="1030" y="456" width="366" height="74" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="1213.0" y="489.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Pen position counters</text>
<text x="1213.0" y="508.0" text-anchor="middle" font-size="11" fill="#63666f">H from M2CLOCK · V from IHSYNC+VDE</text><rect x="1030" y="540" width="366" height="74" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="1213.0" y="573.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Sync + interrupt combiner</text>
<text x="1213.0" y="592.0" text-anchor="middle" font-size="11" fill="#63666f">HINT · VINT · IPL0–2 (74LS148 on chip)</text><rect x="44" y="600" width="250" height="74" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="169.0" y="633.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Pad / pen / joypad port</text>
<text x="169.0" y="652.0" text-anchor="middle" font-size="11" fill="#63666f">sheet 32: 32-bit select-and-buffer</text><rect x="44" y="694" width="250" height="74" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="169.0" y="727.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Clocks out</text>
<text x="169.0" y="746.0" text-anchor="middle" font-size="11" fill="#63666f">CLK8 · CLK4 · CLK2 · KHZ500</text><rect x="44" y="788" width="250" height="74" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/>
<text x="169.0" y="821.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">Reset + test</text>
<text x="169.0" y="840.0" text-anchor="middle" font-size="11" fill="#63666f">PORB · LRESB · TEST tied inactive</text><line x1="294" y1="166" x2="330" y2="166" stroke="#1f5fa8" stroke-width="4" marker-end="url(#a-a)"/><line x1="294" y1="367" x2="330" y2="367" stroke="#b4761a" stroke-width="1.6" marker-end="url(#a-c)"/><line x1="294" y1="280" x2="330" y2="280" stroke="#b4761a" stroke-width="1.6" marker-end="url(#a-c)"/><line x1="630" y1="260" x2="666" y2="260" stroke="#6f5aad" stroke-width="1.6" marker-end="url(#a-s)"/><line x1="630" y1="400" x2="666" y2="340" stroke="#1f5fa8" stroke-width="4" marker-end="url(#a-a)"/><line x1="630" y1="520" x2="666" y2="465" stroke="#8a4fb0" stroke-width="1.6" marker-end="url(#a-k)"/><line x1="1006" y1="340" x2="1030" y2="160" stroke="#2f7f5b" stroke-width="1.6" marker-end="url(#a-d)" stroke-dasharray="5 4"/><line x1="1006" y1="526" x2="1030" y2="495" stroke="#8a4fb0" stroke-width="1.6" marker-end="url(#a-k)" stroke-dasharray="5 4"/><line x1="480" y1="212" x2="480" y2="232" stroke="#8a4fb0" stroke-width="1.6" marker-end="url(#a-k)"/><line x1="480" y1="342" x2="480" y2="362" stroke="#6f5aad" stroke-width="1.6" marker-end="url(#a-s)"/><text x="44" y="900" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Reading order: the phase generator makes the window; the decode makes an address; the mux picks an owner;</text><text x="44" y="920" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the strobe generator turns that into RAS/CAS; everything on the right is a counter that decides who asks next.</text><rect x="0" y="964" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="982" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: redrawn from the TA-4081 / ST-4081 netlists and sheets 1–33, and from research/gstmcu-silicon-implementation.md.</text>
<text x="44" y="997" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">No die geometry is implied or used: this is the design's structure, not its layout.</text>
</svg>
