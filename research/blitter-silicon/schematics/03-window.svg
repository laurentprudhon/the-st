<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010"
     font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="03 · The bus window">
<defs>
  <marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
</marker>
  <marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2f7f5b"/>
</marker>
  <marker id="a-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#b4761a"/>
</marker>
  <marker id="a-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a4fb0"/>
</marker>
  <marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6f5aad"/>
</marker>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/>
</pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/>
</pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">03 · The bus window</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Four clocks of CPU, four of arbitration, then 64 accesses of 4 clocks — and a frame budget that does not close.</text>
<text x="44" y="118" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the start, to scale in clocks</text>
<rect x="44" y="134" width="160" height="56" rx="4" fill="#fdf1de" stroke="#b4761a" stroke-width="1.4"/>
<text x="124.0" y="158" font-size="10.5" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the write lands</text>
<text x="124.0" y="175" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">BUSY set at its end</text>
<rect x="204" y="134" width="160" height="56" rx="4" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.4"/>
<text x="284.0" y="158" font-size="10.5" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">4 clocks: CPU</text>
<text x="284.0" y="175" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">next instruction runs</text>
<rect x="364" y="134" width="160" height="56" rx="4" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.4"/>
<text x="444.0" y="158" font-size="10.5" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">4 clocks: nobody</text>
<text x="444.0" y="175" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">arbitration (8 MegaSTE)</text>
<rect x="524" y="134" width="420" height="56" rx="4" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.4"/>
<text x="734.0" y="158" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the blitter owns the bus</text>
<text x="734.0" y="175" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">4 clocks per access, k accesses per word</text>
<line x1="204" y1="126" x2="204" y2="198" stroke="#22232a" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="364" y1="126" x2="364" y2="198" stroke="#22232a" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="524" y1="126" x2="524" y2="198" stroke="#22232a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="44" y="214" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">t = 0</text>
<text x="204" y="214" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">t = 4</text>
<text x="364" y="214" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">t = 8</text>
<text x="944" y="214" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">… until Y COUNT expires, then 4 clocks to release</text>
<text x="44" y="268" font-size="12" fill="#63666f" text-anchor="start" font-style="italic" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the alternation — a duty cycle, not an average</text>
<rect x="44" y="282" width="168" height="44" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.2"/>
<text x="128" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blitter</text>
<text x="128" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="212" y="282" width="168" height="44" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.2"/>
<text x="296" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CPU</text>
<text x="296" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="380" y="282" width="168" height="44" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.2"/>
<text x="464" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blitter</text>
<text x="464" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="548" y="282" width="168" height="44" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.2"/>
<text x="632" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CPU</text>
<text x="632" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="716" y="282" width="168" height="44" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.2"/>
<text x="800" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blitter</text>
<text x="800" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="884" y="282" width="168" height="44" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.2"/>
<text x="968" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CPU</text>
<text x="968" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="1052" y="282" width="168" height="44" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.2"/>
<text x="1136" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blitter</text>
<text x="1136" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<rect x="1220" y="282" width="168" height="44" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.2"/>
<text x="1304" y="302" font-size="11" fill="#22232a" text-anchor="middle" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">CPU</text>
<text x="1304" y="318" font-size="9.5" fill="#63666f" text-anchor="middle" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses</text>
<text x="44" y="348" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 accesses × 4 clocks = 256 clocks = 32 µs, and the blitter's state survives the hand-over — the release can fall inside a word's read-mix-write.</text>
<rect x="44" y="372" width="660" height="92" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="374.0" y="414.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">63, sometimes</text>
<text x="374.0" y="433.0" text-anchor="middle" font-size="11" fill="#63666f">a CPU access inside the 4-clock latency, counted as a blitter access</text>
<rect x="724" y="372" width="672" height="92" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/>
<text x="1060.0" y="414.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">TMOUT exists only in ST-4082</text>
<text x="1060.0" y="433.0" text-anchor="middle" font-size="11" fill="#63666f">the standalone revisions have no timeout net at all, so the count is unknown there</text>
<text x="44" y="502" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">what a full screen costs — 320 × 200 × 4 planes = 16,000 words</text>
<rect x="44" y="516" width="1352" height="32" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.2"/>
<text x="56" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">operation</text>
<text x="420" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">accesses</text>
<text x="580" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">clocks</text>
<text x="740" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">HOG</text>
<text x="900" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">non-HOG</text>
<text x="1080" y="538" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">a 20 ms frame</text>
<rect x="44" y="548" width="1352" height="38" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="56" y="572" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">fill — no reads at all</text>
<text x="420" y="572" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">16,000</text>
<text x="580" y="572" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64,000</text>
<text x="740" y="572" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">8 ms</text>
<text x="900" y="572" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">~16 ms</text>
<text x="1080" y="572" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">40 % / 80 %</text>
<rect x="44" y="588" width="1352" height="38" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="56" y="612" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">copy — one operand read</text>
<text x="420" y="612" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">32,000</text>
<text x="580" y="612" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">128,000</text>
<text x="740" y="612" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">16 ms</text>
<text x="900" y="612" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">~32 ms</text>
<text x="1080" y="612" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">80 % / 160 %</text>
<rect x="44" y="628" width="1352" height="38" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="56" y="652" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">masked copy — two reads</text>
<text x="420" y="652" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">48,000</text>
<text x="580" y="652" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">192,000</text>
<text x="740" y="652" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">24 ms</text>
<text x="900" y="652" font-size="12" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">~48 ms</text>
<text x="1080" y="652" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">120 % / 240 %</text>
<text x="44" y="700" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">non-HOG is the documented 64/64 alternation: ceil(accesses / 64) blitter windows plus the CPU's equal share, so a full-screen copy does not fit in a frame.</text>
<text x="44" y="744" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">and the one wire that leaves the chip</text>
<rect x="44" y="760" width="250" height="78" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="169.0" y="795.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">U101 · INT</text>
<text x="169.0" y="814.0" text-anchor="middle" font-size="11" fill="#63666f">a level: BUSY, duplicated</text>
<rect x="342" y="760" width="250" height="78" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="467.0" y="795.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">U400 pass-through</text>
<text x="467.0" y="814.0" text-anchor="middle" font-size="11" fill="#63666f">the GSTMCU ignores it</text>
<rect x="640" y="760" width="250" height="78" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="765.0" y="795.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">U400.60 · BINT</text>
<text x="765.0" y="814.0" text-anchor="middle" font-size="11" fill="#63666f">an output of the GSTMCU</text>
<rect x="938" y="760" width="250" height="78" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="1063.0" y="795.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">MFP · GPIP3</text>
<text x="1063.0" y="814.0" text-anchor="middle" font-size="11" fill="#63666f">bit 3, low, busy/idle</text>
<rect x="1236" y="760" width="160" height="78" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/>
<text x="1316.0" y="795.0" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">software</text>
<text x="1316.0" y="814.0" text-anchor="middle" font-size="11" fill="#63666f">poll or AER edge</text>
<line x1="296" y1="799" x2="340" y2="799" stroke="#8a4fb0" stroke-width="2.2" marker-end="url(#a-k)"/>
<line x1="594" y1="799" x2="638" y2="799" stroke="#8a4fb0" stroke-width="2.2" marker-end="url(#a-k)"/>
<line x1="892" y1="799" x2="936" y2="799" stroke="#8a4fb0" stroke-width="2.2" marker-end="url(#a-k)"/>
<line x1="1190" y1="799" x2="1234" y2="799" stroke="#8a4fb0" stroke-width="2.2" marker-end="url(#a-k)"/>
<text x="44" y="862" font-size="11" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Because the line is a level, an interrupt needs an edge: the 68901's AER bit 3 selects it, and the falling edge is the blit's completion. TOS polls instead.</text>
<rect x="0" y="964" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="982" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: the 64-access rule and the HOG definition from Atari's BLiTTER manual; the 4-clock acquire/latency/release and the 63 case from Hatari's</text>
<text x="44" y="997" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">measured model; BINT's direction from board-inventory §3.4 and GPIP3 from Hatari's MFP; the frame arithmetic is this study's (§4.2).</text>
</svg>
