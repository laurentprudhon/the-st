  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
<path d="M24 0 L0 0 0 24" fill="none" stroke="#e8e5db" stroke-width="1"/>
</pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<path d="M0 0 L0 8" stroke="#b4761a" stroke-width="1.4" opacity=".55"/>
</pattern>
</defs>
<rect width="100%" height="100%" fill="#fbfaf6"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity=".6"/>
<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">01 · One word, end to end</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Source read, skew, HOP, LOP, end mask, destination write — and why a word costs 4, 8 or 12 clocks.</text>
<rect x="44" y="118" width="560" height="72" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="324.0" y="150.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">1 · source read</text>
<text x="324.0" y="169.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A24 + $FF8A20 — 1 access, 4 clocks — unless HOP names no source</text>
<rect x="44" y="206" width="560" height="72" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="324.0" y="238.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">2 · skew</text>
<text x="324.0" y="257.0" text-anchor="middle" font-size="11" fill="#63666f">SI0–SI30, 31 stages — SKEW 0–15; FXSR forces the line's first read</text>
<line x1="324" y1="182" x2="324" y2="202" stroke="#2f7f5b" stroke-width="2" marker-end="url(#a-d)"/>
<rect x="44" y="294" width="560" height="72" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/>
<text x="324.0" y="326.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">3 · halftone word</text>
<text x="324.0" y="345.0" text-anchor="middle" font-size="11" fill="#63666f">RAM, not the bus — LINE NUMBER, or the source's low nibble (SMUDGE)</text>
<line x1="324" y1="270" x2="324" y2="290" stroke="#6f5aad" stroke-width="2" marker-end="url(#a-s)"/>
<rect x="44" y="382" width="560" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="324.0" y="414.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">4 · HOP</text>
<text x="324.0" y="433.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A3A, 2 bits — all ones · halftone · source · S AND H</text>
<line x1="324" y1="358" x2="324" y2="378" stroke="#b4761a" stroke-width="2" marker-end="url(#a-c)"/>
<rect x="44" y="470" width="560" height="72" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="324.0" y="502.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">5 · destination read</text>
<text x="324.0" y="521.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A32 — only if needed — the LOP's operand or a mask ≠ $FFFF</text>
<line x1="324" y1="446" x2="324" y2="466" stroke="#2f7f5b" stroke-width="2" marker-end="url(#a-d)"/>
<rect x="44" y="558" width="560" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="324.0" y="590.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">6 · LOP</text>
<text x="324.0" y="609.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A3B, 4 bits — the 16-entry table, one BITBLT cell</text>
<line x1="324" y1="534" x2="324" y2="554" stroke="#b4761a" stroke-width="2" marker-end="url(#a-c)"/>
<rect x="44" y="646" width="560" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="324.0" y="678.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">7 · end mask</text>
<text x="324.0" y="697.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A28 / 2A / 2C — first word / middle words / last word</text>
<line x1="324" y1="622" x2="324" y2="642" stroke="#b4761a" stroke-width="2" marker-end="url(#a-c)"/>
<rect x="44" y="734" width="560" height="72" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/>
<text x="324.0" y="766.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22232a">8 · destination write</text>
<text x="324.0" y="785.0" text-anchor="middle" font-size="11" fill="#63666f">$FF8A32, then step — 1 access, 4 clocks; Y INC on the line's last word</text>
<line x1="324" y1="710" x2="324" y2="730" stroke="#2f7f5b" stroke-width="2" marker-end="url(#a-d)"/>
<text x="660" y="112" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">what a word costs — the unit the model must carry</text>
<rect x="660" y="126" width="736" height="34" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.2"/>
<text x="672" y="148" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">case</text>
<text x="940" y="148" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">reads</text>
<text x="1050" y="148" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">writes</text>
<text x="1170" y="148" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">clocks</text>
<text x="1300" y="148" font-size="11.5" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">when</text>
<rect x="660" y="160" width="736" height="44" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="672" y="187" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">fill — OP 0 or F, HOP 0</text>
<text x="946" y="187" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">0</text>
<text x="1058" y="187" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text>
<text x="1172" y="187" font-size="12.5" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">4</text>
<text x="1232" y="187" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">no operand named</text>
<rect x="660" y="206" width="736" height="44" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="672" y="233" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">copy — one operand</text>
<text x="946" y="233" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text>
<text x="1058" y="233" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text>
<text x="1172" y="233" font-size="12.5" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">8</text>
<text x="1232" y="233" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the usual blit</text>
<rect x="660" y="252" width="736" height="44" fill="#ffffff" stroke="#8a90a8" stroke-width="1"/>
<text x="672" y="279" font-size="11.5" fill="#22232a" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">masked, or a D-dependent LOP</text>
<text x="946" y="279" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">2</text>
<text x="1058" y="279" font-size="11.5" fill="#2f7f5b" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">1</text>
<text x="1172" y="279" font-size="12.5" fill="#b4761a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">12</text>
<text x="1232" y="279" font-size="10" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">mask ≠ $FFFF</text>
<text x="660" y="336" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">The seven-field pipeline the manual draws as a block diagram</text>
<text x="660" y="358" font-size="11.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">source → &lt;&lt; SKEW → HOP with halftone → LOP with destination → ENDMASK → new destination</text>
<text x="660" y="402" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the 32-bit source buffer — two words in, sixteen bits out</text>
<rect x="660" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="682" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="704" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="726" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="748" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="770" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="792" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="814" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="836" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="858" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="880" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="902" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="924" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="946" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="968" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="990" y="416" width="22" height="34" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1012" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1034" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1056" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1078" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1100" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1122" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1144" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1166" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1188" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1210" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1232" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1254" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1276" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1298" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1320" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<rect x="1342" y="416" width="22" height="34" fill="#f6f6f2" stroke="#2f7f5b" stroke-width="1"/>
<text x="660" y="470" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SI16 … SI31 (the older word)</text>
<text x="1012" y="470" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">SI0 … SI15 (the word just read)</text>
<line x1="660" y1="494" x2="1364" y2="494" stroke="#2f7f5b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="660" y="512" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">on each new read the upper half moves down and the lower is replaced; a negative X increment reverses the direction</text>
<text x="44" y="862" font-size="13" fill="#22232a" text-anchor="start" font-weight="700" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">one line worked: 350 pixels from phase 3 — X COUNT 22, three masks</text>
<rect x="44" y="878" width="440" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="264.0" y="910.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">word 1 · ENDMASK 1</text>
<text x="264.0" y="929.0" text-anchor="middle" font-size="11" fill="#63666f">$1FFF — writes pixels 3–15</text>
<rect x="500" y="878" width="440" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="720.0" y="910.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">words 2–21 · ENDMASK 2</text>
<text x="720.0" y="929.0" text-anchor="middle" font-size="11" fill="#63666f">$FFFF — writes the whole word</text>
<rect x="956" y="878" width="440" height="72" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/>
<text x="1176.0" y="910.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">word 22 · ENDMASK 3</text>
<text x="1176.0" y="929.0" text-anchor="middle" font-size="11" fill="#63666f">$F000 — writes pixels 0–3</text>
<text x="44" y="972" font-size="10.5" fill="#63666f" text-anchor="start" font-family="'Iosevka', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">X COUNT counts the words, the first one included; a mask that is not $FFFF costs the destination read; if X COUNT is 1, ENDMASK 1 is the mask for the only write.</text>
<rect x="0" y="974" width="1440" height="46" fill="#f4f1e8"/>
<text x="44" y="992" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Provenance: the register semantics from Atari's BLiTTER manual (25 Jan 1990); the per-access clock costs and the 4-clock read/write</text>
<text x="44" y="1007" font-size="11" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">constants from Hatari's measured model; the read-count rule from the manual's "a read will only be performed if it is required".</text>
</svg>
