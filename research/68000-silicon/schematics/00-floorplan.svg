<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">00 · The die at a glance</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Where the parts sit on the silicon — drawn in the orientation of the 1983 labelled die photograph, not to scale.</text>
<rect x="26" y="96" width="1388" height="830" rx="12" fill="none" stroke="#98a0ac" stroke-width="1.8" stroke-dasharray="10 7"/><text x="36" y="942" text-anchor="start" font-size="11.5" fill="#98a0ac" font-weight="400">bond pads (64 pins) around the whole perimeter</text><rect x="44" y="120" width="66" height="300" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="77.0" y="258.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">INT</text><text x="77.0" y="274.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">LOG</text><text x="77.0" y="292.0" text-anchor="middle" font-size="10" fill="#63666f">interrupt</text><rect x="44" y="436" width="66" height="140" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="77.0" y="494.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">FC</text><text x="77.0" y="510.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">LOG</text><text x="77.0" y="528.0" text-anchor="middle" font-size="10" fill="#63666f">func code</text><rect x="44" y="592" width="66" height="110" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/><text x="77.0" y="643.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">BUF</text><text x="77.0" y="661.0" text-anchor="middle" font-size="10" fill="#63666f">inputs</text><rect x="128" y="120" width="320" height="66" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="288.0" y="148.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">CLOCK GENERATORS · TIMER & E</text><text x="288.0" y="168.25" text-anchor="middle" font-size="11.5" fill="#63666f">φ1 / φ2 and the E divider</text><rect x="128" y="196" width="320" height="50" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="288.0" y="216.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">DECODE DRIVERS</text><text x="288.0" y="236.25" text-anchor="middle" font-size="11.5" fill="#63666f">phase fan-out to every block</text><rect x="128" y="268" width="320" height="168" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/><text x="288.0" y="350.75" text-anchor="middle" font-size="19" font-weight="700" fill="#22232a">µROM</text><text x="288.0" y="370.25" text-anchor="middle" font-size="11.5" fill="#63666f">microcode · 544 × 17</text><rect x="128" y="452" width="320" height="236" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/><text x="288.0" y="568.75" text-anchor="middle" font-size="19" font-weight="700" fill="#22232a">NROM</text><text x="288.0" y="588.25" text-anchor="middle" font-size="11.5" fill="#63666f">nanocode · 336 × 68</text><rect x="476" y="120" width="290" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="621.0" y="146.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">µP CONTROL LOGIC</text><text x="621.0" y="166.25" text-anchor="middle" font-size="11.5" fill="#63666f">bus state machine S0–S7</text><rect x="790" y="120" width="250" height="62" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="915.0" y="146.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">BUS CONTROL</text><text x="915.0" y="166.25" text-anchor="middle" font-size="11.5" fill="#63666f">DTACK · BERR · arbitration</text><rect x="476" y="196" width="290" height="52" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="621.0" y="217.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">A0 MUX CONTROL</text><text x="621.0" y="237.25" text-anchor="middle" font-size="11.5" fill="#63666f">exception address override</text><rect x="790" y="196" width="250" height="52" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="915.0" y="217.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">A1 DECODE</text><text x="915.0" y="237.25" text-anchor="middle" font-size="11.5" fill="#63666f">opcode → entry point</text><rect x="790" y="260" width="250" height="52" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="915.0" y="281.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">A2 / A3 DECODE</text><text x="915.0" y="301.25" text-anchor="middle" font-size="11.5" fill="#63666f">2nd and 3rd entry points</text><rect x="790" y="324" width="250" height="50" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="915.0" y="344.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">BRANCH PLA</text><text x="915.0" y="364.25" text-anchor="middle" font-size="11.5" fill="#63666f">C1/C0 from the condition</text><rect x="790" y="386" width="250" height="50" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="915.0" y="406.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">TRAP & ILL. PLA</text><text x="915.0" y="426.25" text-anchor="middle" font-size="11.5" fill="#63666f">vectors · illegal · priv</text><rect x="790" y="448" width="250" height="50" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="915.0" y="468.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">IRD REG</text><text x="915.0" y="488.25" text-anchor="middle" font-size="11.5" fill="#63666f">the opcode in execution</text><rect x="476" y="540" width="564" height="76" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="758.0" y="574.75" text-anchor="middle" font-size="15" font-weight="700" fill="#22232a">IRD BUS — the decode PLA bank (not a bus)</text><text x="758.0" y="594.25" text-anchor="middle" font-size="11.5" fill="#63666f">~70 control bits from the two ROMs  →  ~200 datapath control lines</text><rect x="476" y="632" width="564" height="46" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="758.0" y="651.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">ALU CONTROL</text><text x="758.0" y="670.75" text-anchor="middle" font-size="11.5" fill="#63666f">15 rows × 5 columns matrix</text><rect x="128" y="724" width="306" height="128" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="281.0" y="784.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">ADDRESS HIGH</text><text x="281.0" y="803.75" text-anchor="middle" font-size="11.5" fill="#63666f">high words + AUH</text><rect x="444" y="724" width="306" height="128" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="597.0" y="784.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">ADDRESS LOW</text><text x="597.0" y="803.75" text-anchor="middle" font-size="11.5" fill="#63666f">low words + AUL</text><rect x="760" y="724" width="306" height="128" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="913.0" y="784.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">DATA</text><text x="913.0" y="803.75" text-anchor="middle" font-size="11.5" fill="#63666f">low words + the ALU</text><rect x="128" y="872" width="306" height="34" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/><text x="281.0" y="893.0" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">ADDRESS BUFFERS → A1–A23</text><rect x="1236" y="500" width="92" height="380" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="1282.0" y="678.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">DATA</text><text x="1282.0" y="693.75" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">BUFFER</text><text x="1282.0" y="709.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">D0–D15</text><line x1="448" y1="352" x2="476" y2="352" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><line x1="448" y1="352" x2="476" y2="352" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="448" y1="352" x2="476" y2="352" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="462" y="340" text-anchor="middle" font-size="11" fill="#b4761a" font-weight="700">10-bit address</text><line x1="448" y1="570" x2="476" y2="570" stroke="#b4761a" stroke-width="8" stroke-linecap="round"/><line x1="448" y1="570" x2="476" y2="570" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="448" y1="570" x2="476" y2="570" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="462" y="558" text-anchor="middle" font-size="11" fill="#b4761a" font-weight="700">68 + 17 bits</text><line x1="300" y1="688" x2="300" y2="720" stroke="#b4761a" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="300" y1="688" x2="300" y2="720" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="300" y1="688" x2="300" y2="720" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="308" y="706" text-anchor="start" font-size="11" fill="#b4761a" font-weight="400">control lines down</text><line x1="900" y1="696" x2="900" y2="720" stroke="#b4761a" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="900" y1="696" x2="900" y2="720" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="900" y1="696" x2="900" y2="720" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="1066" y1="788" x2="1234" y2="788" stroke="#2f7f5b" stroke-width="8" stroke-linecap="round"/><line x1="1066" y1="788" x2="1234" y2="788" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="1066" y1="788" x2="1234" y2="788" stroke="#2f7f5b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-d)"/><text x="1150" y="776" text-anchor="middle" font-size="11" fill="#2f7f5b" font-weight="700">16</text><line x1="128" y1="788" x2="96" y2="788" stroke="#1f5fa8" stroke-width="11" stroke-linecap="round"/><line x1="128" y1="788" x2="96" y2="788" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="128" y1="788" x2="96" y2="788" stroke="#1f5fa8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-a)"/><text x="1070" y="120" text-anchor="start" font-size="11" fill="#63666f" font-weight="700">LEGEND</text><line x1="1070" y1="136" x2="1098" y2="136" stroke="#8a4fb0" stroke-width="6" stroke-linecap="round"/><text x="1108" y="140" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">clock / sequencing</text><line x1="1070" y1="154" x2="1098" y2="154" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><text x="1108" y="158" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">control and decode</text><line x1="1070" y1="172" x2="1098" y2="172" stroke="#6f5aad" stroke-width="6" stroke-linecap="round"/><text x="1108" y="176" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">control store (ROM)</text><line x1="1070" y1="190" x2="1098" y2="190" stroke="#2f7f5b" stroke-width="6" stroke-linecap="round"/><text x="1108" y="194" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">data path</text><line x1="1070" y1="208" x2="1098" y2="208" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><text x="1108" y="212" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">address path</text><line x1="1070" y1="226" x2="1098" y2="226" stroke="#8a90a8" stroke-width="6" stroke-linecap="round"/><text x="1108" y="230" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">buffers / pads</text><text x="1070" y="256" text-anchor="start" font-size="12.5" fill="#22232a" font-weight="700">Three bands to remember</text><text x="1070" y="280" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">· top — clocks, bus control, opcode decode</text><text x="1070" y="299" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">· middle — the two control stores</text><text x="1070" y="318" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">· bottom — the execution unit</text><text x="1070" y="372" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">The photograph also names separate</text><text x="1070" y="390" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">A0 / A1 / A2-A3 decoders and a</text><text x="1070" y="408" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">TIMER & E LOGIC block; modern work</text><text x="1070" y="426" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">confirms the roles, not the exact</text><text x="1070" y="444" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">boundaries between them.</text><text x="44" y="968" text-anchor="start" font-size="11.5" fill="#98a0ac" font-weight="400" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-style="italic">MC68000 · educational block schematic · not a circuit diagram</text></svg>
