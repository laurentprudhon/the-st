<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">02 · From opcode to control line</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Three decoders turn an instruction into three microcode addresses; both ROMs read at once; a PLA bank keyed on the opcode expands their bits into the datapath controls.</text>
<rect x="60" y="108" width="150" height="54" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="135.0" y="130.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">D0–D15 pads</text><text x="135.0" y="149.5" text-anchor="middle" font-size="11.5" fill="#63666f">instruction word</text><rect x="250" y="108" width="140" height="54" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/><text x="320.0" y="131.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">IRC</text><text x="320.0" y="150.75" text-anchor="middle" font-size="11.5" fill="#63666f">next word</text><rect x="430" y="108" width="140" height="54" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/><text x="500.0" y="131.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">IR</text><text x="500.0" y="150.75" text-anchor="middle" font-size="11.5" fill="#63666f">being decoded</text><rect x="610" y="108" width="140" height="54" rx="8" fill="#eef0f5" stroke="#8a90a8" stroke-width="1.6"/><text x="680.0" y="131.25" text-anchor="middle" font-size="14" font-weight="700" fill="#22232a">IRD</text><text x="680.0" y="150.75" text-anchor="middle" font-size="11.5" fill="#63666f">being executed</text><line x1="210" y1="135" x2="248" y2="135" stroke="#2f7f5b" stroke-width="8" stroke-linecap="round"/><line x1="210" y1="135" x2="248" y2="135" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="210" y1="135" x2="248" y2="135" stroke="#2f7f5b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-d)"/><line x1="390" y1="135" x2="428" y2="135" stroke="#2f7f5b" stroke-width="8" stroke-linecap="round"/><line x1="390" y1="135" x2="428" y2="135" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="390" y1="135" x2="428" y2="135" stroke="#2f7f5b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-d)"/><text x="409" y="123" text-anchor="middle" font-size="11" fill="#2f7f5b" font-weight="700">load IR</text><line x1="570" y1="135" x2="608" y2="135" stroke="#2f7f5b" stroke-width="8" stroke-linecap="round"/><line x1="570" y1="135" x2="608" y2="135" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="570" y1="135" x2="608" y2="135" stroke="#2f7f5b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-d)"/><text x="589" y="123" text-anchor="middle" font-size="11" fill="#2f7f5b" font-weight="700">load IRD</text><text x="780" y="122" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">IRD drives the decode PLAs, the ALU row decoder,</text><text x="780" y="138" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">the branch conditions and the field translation unit.</text><text x="780" y="158" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">IR is what the PLAs see; IRD is what the datapath obeys.</text><text x="60" y="214" text-anchor="start" font-size="10.5" fill="#63666f" font-weight="400">16 bits of opcode (and its complement) fan out to three PLAs</text><line x1="500" y1="162" x2="500" y2="240" stroke="#b4761a" stroke-width="8" stroke-linecap="round"/><line x1="500" y1="162" x2="500" y2="240" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="500" y1="162" x2="500" y2="240" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="230" y1="248" x2="700" y2="248" stroke="#b4761a" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="248" x2="230" y2="262" stroke="#b4761a" stroke-width="2" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="415" y1="248" x2="415" y2="262" stroke="#b4761a" stroke-width="2" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="600" y1="248" x2="600" y2="262" stroke="#b4761a" stroke-width="2" stroke-linecap="round" marker-end="url(#a-c)"/><rect x="140" y="264" width="200" height="76" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="240.0" y="297.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">A1 DECODE</text><text x="240.0" y="317.25" text-anchor="middle" font-size="11.5" fill="#63666f">PLA · 149 terms</text><rect x="356" y="264" width="170" height="76" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="441.0" y="297.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">A2 / A3 DECODE</text><text x="441.0" y="317.0" text-anchor="middle" font-size="11.5" fill="#63666f">shared AND plane</text><rect x="540" y="264" width="160" height="76" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="620.0" y="297.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">ILLEGAL · PRIV</text><text x="620.0" y="316.5" text-anchor="middle" font-size="11.5" fill="#63666f">from the A2/A3 PLA</text><rect x="60" y="386" width="640" height="58" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="380.0" y="410.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">MICROCODE ADDRESS SELECTOR</text><text x="380.0" y="430.0" text-anchor="middle" font-size="11.5" fill="#63666f">{ NMA · A1 · A2 · A3 · A0 · A0S }  →  10-bit registered address</text><line x1="270" y1="340" x2="270" y2="384" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><line x1="270" y1="340" x2="270" y2="384" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="270" y1="340" x2="270" y2="384" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="430" y1="340" x2="430" y2="384" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><line x1="430" y1="340" x2="430" y2="384" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="430" y1="340" x2="430" y2="384" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="620" y1="340" x2="620" y2="384" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><line x1="620" y1="340" x2="620" y2="384" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="620" y1="340" x2="620" y2="384" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><rect x="760" y="386" width="260" height="58" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="890.0" y="410.25" text-anchor="middle" font-size="12" font-weight="700" fill="#22232a">EXCEPTION LOGIC</text><text x="890.0" y="429.75" text-anchor="middle" font-size="11.5" fill="#63666f">A0 at a boundary · A0S now</text><line x1="758" y1="415" x2="702" y2="415" stroke="#8a4fb0" stroke-width="6" stroke-linecap="round"/><line x1="758" y1="415" x2="702" y2="415" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="758" y1="415" x2="702" y2="415" stroke="#8a4fb0" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-k)"/><path d="M 60 648 L 28 648 L 28 415 L 58 415" fill="none" stroke="#1f5fa8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-a)"/><text x="34" y="470" text-anchor="start" font-size="10" fill="#1f5fa8" font-weight="400" transform="rotate(-90 34 470)">next address, next cycle</text><path d="M 380 444 L 380 462 L 250 462 L 250 480" fill="none" stroke="#b4761a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-c)"/><path d="M 380 462 L 700 462 L 700 480" fill="none" stroke="#b4761a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-c)"/><rect x="60" y="480" width="380" height="92" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/><text x="250.0" y="522.75" text-anchor="middle" font-size="15" font-weight="700" fill="#22232a">µROM  544 × 17</text><text x="250.0" y="542.25" text-anchor="middle" font-size="11.5" fill="#63666f">next address · condition · access class</text><rect x="520" y="480" width="380" height="92" rx="8" fill="#ece7f7" stroke="#6f5aad" stroke-width="1.6"/><text x="710.0" y="522.75" text-anchor="middle" font-size="15" font-weight="700" fill="#22232a">NROM  336 × 68</text><text x="710.0" y="542.25" text-anchor="middle" font-size="11.5" fill="#63666f">transfers · AU/ALU selects · flags</text><text x="910" y="500" text-anchor="start" font-size="10.5" fill="#63666f" font-weight="400">one address, both ROMs,</text><text x="910" y="516" text-anchor="start" font-size="10.5" fill="#63666f" font-weight="400">read in the same cycle</text><text x="910" y="542" text-anchor="start" font-size="10.5" fill="#6f5aad" font-weight="400">many-to-one: 544 addresses</text><text x="910" y="558" text-anchor="start" font-size="10.5" fill="#6f5aad" font-weight="400">share 336 nanowords</text><rect x="60" y="620" width="190" height="52" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/><text x="155.0" y="641.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">next address</text><text x="155.0" y="660.5" text-anchor="middle" font-size="11.5" fill="#63666f">10 bits</text><rect x="60" y="686" width="190" height="52" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/><text x="155.0" y="707.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">branch control</text><text x="155.0" y="726.5" text-anchor="middle" font-size="11.5" fill="#63666f">CBC, 5 bits</text><rect x="60" y="752" width="190" height="52" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="155.0" y="773.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">access class</text><text x="155.0" y="792.5" text-anchor="middle" font-size="11.5" fill="#63666f">i/f/n/t · p/r/w · type</text><line x1="155" y1="572" x2="155" y2="618" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><line x1="155" y1="572" x2="155" y2="618" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="155" y1="572" x2="155" y2="618" stroke="#1f5fa8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-a)"/><line x1="250" y1="546" x2="300" y2="546" stroke="#b4761a" stroke-width="8" stroke-linecap="round"/><line x1="250" y1="546" x2="300" y2="546" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="250" y1="546" x2="300" y2="546" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="300" y1="546" x2="300" y2="686" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><line x1="300" y1="546" x2="300" y2="686" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="300" y1="546" x2="300" y2="686" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><line x1="250" y1="686" x2="300" y2="686" stroke="#b4761a" stroke-width="1.2" stroke-linecap="round"/><rect x="330" y="686" width="210" height="52" rx="8" fill="#e8eefa" stroke="#1f5fa8" stroke-width="1.6"/><text x="435.0" y="707.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#22232a">BRANCH UNIT</text><text x="435.0" y="726.5" text-anchor="middle" font-size="11.5" fill="#63666f">condition → C1/C0</text><text x="330" y="754" text-anchor="start" font-size="10" fill="#63666f" font-weight="400">inputs: flags, IRD, AU = 0</text><text x="330" y="770" text-anchor="start" font-size="10" fill="#63666f" font-weight="400">C1/C0 replace address bits 7:6</text><text x="330" y="786" text-anchor="start" font-size="10" fill="#63666f" font-weight="400">→ four targets in one row</text><line x1="300" y1="712" x2="328" y2="712" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><line x1="300" y1="712" x2="328" y2="712" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="300" y1="712" x2="328" y2="712" stroke="#1f5fa8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-a)"/><rect x="600" y="620" width="380" height="84" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="790.0" y="657.75" text-anchor="middle" font-size="13" font-weight="700" fill="#22232a">IRD DECODE PLA BANK</text><text x="790.0" y="677.25" text-anchor="middle" font-size="11.5" fill="#63666f">keyed on the instruction register</text><line x1="710" y1="572" x2="710" y2="618" stroke="#b4761a" stroke-width="11" stroke-linecap="round"/><line x1="710" y1="572" x2="710" y2="618" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="710" y1="572" x2="710" y2="618" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="710" y="598" text-anchor="middle" font-size="11" fill="#b4761a" font-weight="700">68 bits</text><rect x="600" y="740" width="380" height="56" rx="8" fill="#fdf1de" stroke="#b4761a" stroke-width="1.6"/><text x="790.0" y="763.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">≈ 200 CONTROL LINES</text><text x="790.0" y="783.0" text-anchor="middle" font-size="11.5" fill="#63666f">register strobes · bus selects · flag masks</text><line x1="790" y1="704" x2="790" y2="738" stroke="#b4761a" stroke-width="8" stroke-linecap="round"/><line x1="790" y1="704" x2="790" y2="738" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="790" y1="704" x2="790" y2="738" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="600" y="826" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">The ROMs supply only ~70 of the ~200 signals;</text><text x="600" y="842" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">the rest is hard-wired decode of the opcode.</text><rect x="1060" y="620" width="220" height="84" rx="8" fill="#f2eaf8" stroke="#8a4fb0" stroke-width="1.6"/><text x="1170.0" y="649.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">BUS STATE</text><text x="1170.0" y="666.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">MACHINE</text><text x="1170.0" y="684.75" text-anchor="middle" font-size="10.5" fill="#63666f">S0–S7 · waits on DTACK</text><rect x="1060" y="740" width="220" height="84" rx="8" fill="#e7f2ec" stroke="#2f7f5b" stroke-width="1.6"/><text x="1170.0" y="769.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">EXECUTION</text><text x="1170.0" y="786.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22232a">UNIT</text><text x="1170.0" y="804.75" text-anchor="middle" font-size="10.5" fill="#63666f">three sections</text><path d="M 250 778 L 1040 778 L 1040 662 L 1058 662" fill="none" stroke="#b4761a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-c)"/><line x1="980" y1="768" x2="1058" y2="768" stroke="#b4761a" stroke-width="8" stroke-linecap="round"/><line x1="980" y1="768" x2="1058" y2="768" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="980" y1="768" x2="1058" y2="768" stroke="#b4761a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-c)"/><text x="250" y="894" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">Every microcycle: one microword fixes the next address and, at most, one bus access.</text><text x="250" y="920" text-anchor="start" font-size="11" fill="#63666f" font-weight="400">A microword that must finish a bus access holds the sequencer until the cycle ends.</text><text x="1060" y="120" text-anchor="start" font-size="11" fill="#63666f" font-weight="700">LEGEND</text><line x1="1060" y1="136" x2="1088" y2="136" stroke="#1f5fa8" stroke-width="6" stroke-linecap="round"/><text x="1098" y="140" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">microcode address</text><line x1="1060" y1="154" x2="1088" y2="154" stroke="#b4761a" stroke-width="6" stroke-linecap="round"/><text x="1098" y="158" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">control</text><line x1="1060" y1="172" x2="1088" y2="172" stroke="#2f7f5b" stroke-width="6" stroke-linecap="round"/><text x="1098" y="176" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">data</text><line x1="1060" y1="190" x2="1088" y2="190" stroke="#8a4fb0" stroke-width="6" stroke-linecap="round"/><text x="1098" y="194" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">clock · exceptions</text><line x1="1060" y1="208" x2="1088" y2="208" stroke="#6f5aad" stroke-width="6" stroke-linecap="round"/><text x="1098" y="212" text-anchor="start" font-size="11.5" fill="#63666f" font-weight="400">ROM</text><text x="44" y="998" text-anchor="start" font-size="11.5" fill="#98a0ac" font-weight="400" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-style="italic">MC68000 · control path · after US 4,325,121 and the die-derived PLA listings</text></svg>
