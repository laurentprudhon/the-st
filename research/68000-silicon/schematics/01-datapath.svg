<text x="44" y="44" font-size="25" font-weight="700" fill="#22232a" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">01 · The execution unit — three sections, two buses</text>
<text x="44" y="71" font-size="14" fill="#63666f" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">Every 32-bit register is split across sections. Each section carries an address lane and a data lane, so six 16-bit transfers can happen at once.</text>
<rect x="80" y="102" width="390" height="592" rx="14" fill="#ffffff" fill-opacity=".5" stroke="#98a0ac" stroke-width="1.4"/><text x="275" y="128" text-anchor="middle" font-size="13.5" fill="#22232a" font-weight="700">HIGH SECTION</text><text x="275" y="144" text-anchor="middle" font-size="10.5" fill="#63666f" font-weight="400">upper 16 bits of every 32-bit register · AUH</text><rect x="490" y="102" width="390" height="592" rx="14" fill="#ffffff" fill-opacity=".5" stroke="#98a0ac" stroke-width="1.4"/><text x="685" y="128" text-anchor="middle" font-size="13.5" fill="#22232a" font-weight="700">LOW SECTION</text><text x="685" y="144" text-anchor="middle" font-size="10.5" fill="#63666f" font-weight="400">lower 16 bits of A0–A7, PC, AT · AUL</text><rect x="900" y="102" width="390" height="592" rx="14" fill="#ffffff" fill-opacity=".5" stroke="#98a0ac" stroke-width="1.4"/><text x="1095" y="128" text-anchor="middle" font-size="13.5" fill="#22232a" font-weight="700">DATA SECTION</text><text x="1095" y="144" text-anchor="middle" font-size="10.5" fill="#63666f" font-weight="400">lower 16 bits of D0–D7 · the ALU</text><line x1="80" y1="250" x2="1290" y2="250" stroke="#1f5fa8" stroke-width="11" stroke-linecap="round"/><line x1="80" y1="250" x2="1290" y2="250" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><line x1="80" y1="336" x2="1290" y2="336" stroke="#2f7f5b" stroke-width="11" stroke-linecap="round"/><line x1="80" y1="336" x2="1290" y2="336" stroke="#fbfaf6" stroke-width="2.4" stroke-linecap="round"/><text x="700" y="234" text-anchor="middle" font-size="11.5" fill="#1f5fa8" font-weight="700">ADDRESS BUS  AB(h) · AB(l) · AB(d)</text><text x="700" y="366" text-anchor="middle" font-size="11.5" fill="#2f7f5b" font-weight="700">DATA BUS  DB(h) · DB(l) · DB(d)</text><rect x="463" y="235" width="14" height="30" rx="3" fill="#fbfaf6" stroke="#8a90a8" stroke-width="1.6"/><rect x="463" y="321" width="14" height="30" rx="3" fill="#fbfaf6" stroke="#8a90a8" stroke-width="1.6"